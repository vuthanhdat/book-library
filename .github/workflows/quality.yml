name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 x64
            os: windows-latest
          - name: macOS 15 Intel x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust quality components
        run: rustup component add clippy rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check PDFium smoke formatting
        run: cargo fmt --manifest-path spikes/pdfium-smoke/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compile PDFium smoke
        run: cargo check --manifest-path spikes/pdfium-smoke/Cargo.toml

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Check Markdown links
        run: npm run check:links

      - name: Build Tauri application
        run: npm run tauri build -- --debug --no-bundle
